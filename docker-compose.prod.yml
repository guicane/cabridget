version: '3.8'
name: cabridget

services:
  app:
    image: guicane/cabridget:0.1.1
    container_name: cabridget-app
    restart: always
    expose:
      - "3000"
    environment:
      # Connects to the db container and looks for the cabridget_db database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/cabridget_db?schema=public
    networks:
      - proxy-net
      - internal-net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: cabridget-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cabridget_db
    volumes:
      - /mnt/ext-ssd/cabridget/postgres_data_clean:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cabridget_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - internal-net

networks:
  proxy-net:
    external: true
  internal-net:
    internal: true


