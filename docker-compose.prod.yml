version: '3.8'

services:
  app:
    # Replace the username below with your actual Docker Hub username
    image: your-docker-username/cabridget:latest
    restart: always
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/macro_tracker?schema=public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: macro_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d macro_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
