name: Build Docker Image

on:
  push:
    branches:
      - main
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Deployment target (homelab host) is x86_64 only. Multi-arch via
          # QEMU roughly doubles build time and is a common source of flaky
          # builds for native modules (Prisma engines etc). Add arm64 back
          # only if another deployment target actually needs it.
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/cabridget:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/cabridget:${{ github.ref_name }}
