version: '3.8'
name: cabridget

services:
  app:
    image: guicane/cabridget:0.3.0
    container_name: cabridget-app
    restart: always
    expose:
      - "3000"
    environment:
      # Connects to the db container and looks for the cabridget_db database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@cabridget-db:5432/cabridget_db?schema=public
    networks:
      - proxy-net
      - internal-net
    depends_on:
      db:
        condition: service_healthy
    labels:
      - kuma.app.docker.name=app
      - kuma.app.docker.docker_container=app
      - kuma.app.docker.parent_name=cabridget-group
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:18-alpine
    container_name: cabridget-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cabridget_db
    volumes:
      - /mnt/ext-ssd/cabridget/postgres_data_clean:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cabridget_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - internal-net
    labels:
      - kuma.db.docker.name=db
      - kuma.db.docker.docker_container=db
      - kuma.db.docker.parent_name=cabridget-group

  backup:
    image: prodrigestivill/postgres-backup-local:18-alpine
    container_name: cabridget-backup
    restart: always
    environment:
      POSTGRES_HOST: cabridget-db
      POSTGRES_DB: cabridget_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - /mnt/ext-ssd/cabridget/backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net

networks:
  proxy-net:
    external: true
  internal-net:
    internal: true
