version: '3.8'

services:
  app:
    # Use a custom Dockerfile or standard node image for development
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/macro_tracker?schema=public
      - NODE_ENV=development
    # Command for local development
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: macro_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d macro_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
